<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CookingDesk - Saved Recipes</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/saved.css">
</head>
<body>

<header class="status-bar">
    <div class="status-left">
        <img src="img/transparentlogo.svg" class="logo" alt="logo">
        <span class="app-title">Saved Recipes</span>
    </div>
    <div class="status-right">
        <a href="cook.html" onclick="GoCook(event)" class="btn btn-primary">Back</a>
        <span id="time">--:--</span>
        <span id="battery">--%</span>
        <img id="wifi" src="img/wifioff.svg" class="icon" alt="wifi">
    </div>
</header>

<div id="loadingOverlay">
    <div class="loader-container">
        <div class="loader-ring"></div>
        <img src="img/transparentlogo.svg" class="loader-logo" alt="loading...">
    </div>
</div>

<div class="search-bar">
    <input id="searchInput" placeholder="Search">
    <button class="search-action" id="searchBtn">Search</button>
</div>

<main id="grid" class="results-grid"></main>

<div id="deleteModal" class="modal-overlay">
    <div class="modal-box">
        <div id="deleteText">Do you want to delete this recipe?</div>
        <button class="btn-delete" id="confirmDeleteBtn">Yes</button>
        <button class="btn-cancel" id="cancelDeleteBtn">Cancel</button>
    </div>
</div>

<div id="errorModal" class="modal-overlay">
    <div class="modal-box">
        <div id="errorText" style="color: #c62828; font-weight: bold; margin-bottom: 10px;"></div>
        <div style="font-size: 14px; color: #555;">Try to reload the page</div>
        <button class="btn-reload" onclick="handleReload()">Reload</button>
    </div>
</div>

<script src="APIsystem/apibridge.js"></script>
<script src="js/saved.js"></script>
<script src="js/app.js"></script>
</body>
</html>
