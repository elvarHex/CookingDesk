<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#003d20">
    <title>CookingDesk - Loading...</title>

    <link rel="stylesheet" href="css/index.css">
</head>
<body>

    <div class="loading-card">
        <img src="img/transparentlogo.svg" alt="CookingDesk">
        <div class="loading-text">Loading</div>
        <div class="spinner"></div>
    </div>

    <div id="warning" class="portrait-warning">
        <div class="spinner" style="border-top-color: white; margin-bottom: 20px;"></div>
        <h2>Rotate your device</h2>
        <p>CookingDesk only works in landscape mode.<br>Loading will continue as soon as you rotate your screen.</p>
    </div>

    <script src="js/index.js"></script>
</body>
</html>
