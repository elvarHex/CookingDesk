<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CookingDesk - Cook</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="status-bar">
        <div class="status-left">
            <img src="img/transparentlogo.svg" class="logo" alt="Logo">
            <span class="app-title">Cook</span>
        </div>

        <div class="status-right">
            <a href="home.html" onclick="GoHome(event)" class="btn btn-primary">Back</a>
            <span id="time">--:--</span>
            <span id="battery">--%</span>
            <img id="wifi" src="img/wifion.svg" class="icon" alt="WiFi Status">
        </div>
    </header>

    <main class="main-grid">
        <a class="card-button-HC" href="search.html">
            <img src="img/search.svg" alt="Search">
            <span>Search</span>
        </a>

        <a class="card-button-HC" href="saved.html" id="savedLink">
            <img src="img/saved.svg" alt="Saved">
            <span>Saved recipes</span>
        </a>
    </main>

    <div id="cloudModal" class="cloud-modal-overlay">
        <div class="cloud-modal">
            <h2>No cloud service</h2>
            <p>You can't access cloud features because you haven't connected jsonbin.io. Click Settings to connect your account.</p>
            <div class="cloud-modal-actions">
                <button class="cloud-modal-btn-cancel" onclick="closeCloudModal()">Cancel</button>
                <a href="settings.html" class="cloud-modal-btn-settings">Settings</a>
            </div>
        </div>
    </div>

    <script src="js/cook.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
