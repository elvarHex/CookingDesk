
name: 🐛 Bug Report
description: Report a problem with CookingDesk.
title: "[BUG] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug!
        Please provide as much detail as possible.

  - type: dropdown
    id: application
    attributes:
      label: Application
      description: Which version of CookingDesk is affected?
      options:
        - CookingDesk Desk
        - CookingDesk Mobile
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Application version
      placeholder: "e.g. Desk v1.0.0 or Mobile v0.0.5"
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device
      description: Device model or emulator.
      placeholder: "e.g. Samsung Galaxy S24"
    validations:
      required: false

  - type: input
    id: android
    attributes:
      label: Android version
      placeholder: "e.g. Android 15"
    validations:
      required: false

  - type: textarea
    id: description
    attributes:
      label: Bug description
      description: Clearly describe the problem.
      placeholder: What happened?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the application
        2. Navigate to...
        3. Tap...
        4. Observe the issue
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or logs
      description: Attach screenshots or relevant error logs.
    validations:
      required: false
