<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CookingDesk - Tools</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/tools.css">
</head>
<body>

<header class="status-bar">
    <div class="status-left status-center">
        <img src="img/transparentlogo.svg" class="logo" alt="Logo">
        <span class="app-title">Tools</span>
    </div>

    <div class="status-right">
        <button class="btn-back-circle" onclick="GoHome(event)">
            <img src="img/left.svg" alt="Back">
        </button>
    </div>
</header>

<main class="home-container">
    <h1 class="home-title">Tools</h1>

    <div class="main-grid">
        <a class="card-button-HC" href="tools/timer.html">
            <img src="img/timer.svg" alt="Timer">
            <span>Timer</span>
        </a>

        <a class="card-button-HC" href="tools/counter.html">
            <img src="img/counter.svg" alt="Counter">
            <span>Counter</span>
        </a>
    </div>
</main>

<script src="js/app.js"></script>
</body>
</html>
